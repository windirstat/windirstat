name: Check WSL helper
on:
  push:
    paths: [ 'wslscan/**', 'windirstat/res/wsl/**', '.github/workflows/check-wsl-helper.yml' ]
  pull_request:
    paths: [ 'wslscan/**', 'windirstat/res/wsl/**', '.github/workflows/check-wsl-helper.yml' ]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Zig
        run: python3 -m pip install --user ziglang==0.13.0.post1
      - name: Rebuild the embedded helpers
        run: ZIG="python3 -m ziglang" sh wslscan/build.sh
      - name: Require the committed helpers to match their source
        run: git diff --exit-code --stat -- windirstat/res/wsl
      - name: Smoke test
        run: |
          out=$(windirstat/res/wsl/wds-wsl-scan-x86_64 wslscan | od -An -c -N6 | tr -d ' ')
          test "$out" = "WDSWSL"
